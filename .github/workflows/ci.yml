name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoops_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/autoops_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Migrate disposable CI database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/autoops_ci
        run: |
          alembic upgrade head
          python -c "import os; import psycopg2; connection = psycopg2.connect(os.environ['DATABASE_URL']); cursor = connection.cursor(); cursor.execute(\"SELECT to_regclass('public.incidents'), (SELECT version_num FROM alembic_version)\"); print(cursor.fetchone()); cursor.close(); connection.close()"

      - name: Run PostgreSQL integration tests
        run: >-
          python -m pytest
          backend/tests/test_postgres_smoke.py
          backend/tests/integration/test_incident_lifecycle.py
          backend/tests/integration/test_incident_concurrency.py
          -v

      - name: Compile backend code
        run: python -m compileall -q backend/app backend/tests backend/migrations

      - name: Check whitespace errors
        run: git diff --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
